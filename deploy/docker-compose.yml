# Production-shaped stack: Postgres app DB, FastAPI backend, Next.js frontend,
# and Caddy as the TLS-terminating reverse proxy.
#
# Usage: `docker compose -f deploy/docker-compose.yml up -d` from the repo root.
# Secrets come from an .env file next to this one (see deploy/.env.example).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        # Set INSECURE_TLS=1 in deploy/.env only if your local network
        # intercepts TLS and the build fails with certificate errors.
        INSECURE_TLS: ${INSECURE_TLS:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOSTED_MODE: "true"
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-copilot}
      TENANT_DATA_DIR: /data/tenants
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      KEY_ENCRYPTION_SECRET: ${KEY_ENCRYPTION_SECRET:?set KEY_ENCRYPTION_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://localhost}
      CORS_ALLOW_ORIGINS: ${FRONTEND_ORIGIN:-https://localhost}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # LangSmith tracing (optional). Set the API key to record every agent
      # turn; the backend builds the tracer itself (works with INSECURE_TLS).
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      # Sentry error tracking (optional; empty disables it entirely).
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Dev-only: skip TLS verification on outbound LLM calls for
      # TLS-intercepting networks. Leave empty in production.
      INSECURE_TLS: ${INSECURE_TLS:-}
    volumes:
      - tenant_data:/data/tenants

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        INSECURE_TLS: ${INSECURE_TLS:-}
        # Bake hosted mode into the bundle so the auth gate + dataset manager
        # are active. This is the hosted product build.
        NEXT_PUBLIC_HOSTED_MODE: "true"
        # Browser-side Sentry (optional; baked into the bundle at build time).
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  tenant_data:
  caddy_data:
  caddy_config:
