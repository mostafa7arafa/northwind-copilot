[project]
name = "northwind-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
    "langgraph>=0.2",
    "langgraph-cli[inmem]",
    "faiss-cpu>=1.8",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "openevals>=0.2.0",
    "truststore>=0.10.4",
]

[dependency-groups]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "email-validator>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    # Fernet encryption for stored BYOK provider keys.
    "cryptography>=42.0",
    # Error tracking (opt-in via SENTRY_DSN; the app runs fine without a DSN).
    "sentry-sdk[fastapi]>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
    # Pulled into dev so the web layer (northwind_copilot.web) is importable in
    # tests; the same packages ship in the `web` group for running the service.
    "fastapi>=0.110",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# `auto` runs `async def test_*` coroutines without a per-test marker.
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["northwind_copilot"]

[tool.coverage.report]
show_missing = true
skip_covered = false
