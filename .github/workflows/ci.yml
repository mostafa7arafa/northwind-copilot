name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
      - name: Sync dependencies
        run: uv sync --frozen --group dev --group web
      - name: Lint (black, isort, flake8)
        run: |
          uv run black --check northwind_copilot tests
          uv run isort --check-only northwind_copilot tests
          uv run flake8 northwind_copilot tests
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci || npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  security:
    name: Security (secret scan + audits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"
      - name: Python dependency audit
        run: uvx pip-audit || true  # advisory until we triage the baseline

  # Build and push images only after all checks pass on the main branches.
  images:
    name: Build & push images
    needs: [backend, frontend, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: true
          tags: ghcr.io/${{ github.repository }}-backend:${{ github.sha }}
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
